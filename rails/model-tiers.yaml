# 비용 계층 라우팅 정책 (seam) — llm-wiki lib/anthropic.ts providerFor() 일반화.
#
# 지금(R1~R3): 이 파일은 "의도"만 선언한다. 명령/스킬 step의 [tier: ...] 태그가 여기를 가리킨다.
#   사람이 직접 실행할 땐 무시해도 된다.
# 나중(R4): 라우팅 엔진이 이 파일 + .env 를 읽어 step의 tier 태그에 따라 프로바이더를 고른다.
#   해석 우선순위(llm-wiki 규약 일반화): .env 의 <TIER>_PROVIDER > LLM_PROVIDER > default_tier.

default_tier: bulk            # tier 태그가 없으면 비용 안전한 무료로

tiers:
  judgment:
    # 판단이 중요한 소수 단계: 아이디어 프레이밍, N안 심사, 적대적 리뷰, 최종 통합
    provider: anthropic
    model: claude-opus-4-8
    budget_hint: small        # 유료 Claude는 여기에만 소액 배정
  bulk:
    # 대량·지루한 단계: 초안 작성, 보일러플레이트 코드, 문서 확장, smoke 생성
    provider: ollama          # 무료·로컬 (qwen)
    model: qwen3:8b
    fallback: gemini          # 무료 등급·외부 (⚠️ 민감자료 금지)

# 단계 분류 가이드 (명령/스킬 작성 시 태그 부여 기준)
#   judgment ← 틀리면 비싼 결정/품질 게이트: 요구 프레이밍, 아키텍처 선택, critic, 통합
#   bulk     ← 양이 많고 검증으로 잡히는 것: 문서 본문, 코드 생성, 테스트 스캐폴드
