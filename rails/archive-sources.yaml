# archive-sources.yaml — /archive 명령의 입력 계약
#
# 프로젝트 슬러그 → (원본 repo, Claude Code 세션 트랜스크립트 폴더들, 민감도).
# 세션 폴더 베이스는 ~/.claude/projects/ (= %USERPROFILE%\.claude\projects\).
# 폴더명은 작업 디렉터리 경로를 '-'로 인코딩한 것이다(예: E:\agora → E--agora).
# 한 프로젝트가 여러 작업맥락(다른 하위폴더/툴)에서 진행됐으면 sessions 에 여러 개를 둔다.
#
# sensitivity:
#   personal         = 본인 데이터. 평문 커밋 OK.
#   company-internal = 사내 실명·내부주소 포함. 비밀스캔 강하게, 푸시 전 암호화 권장.
# auto_push:
#   true  = 주기적 자동 새로고침(refresh.ps1)이 커밋·푸시까지 자동. 개인 데이터에만.
#   false = 자동 새로고침에서 제외. 수동 /archive + 검토 후에만 푸시. (회사 데이터 기본값)
#   ※ [R1] /retro §0 자동수집도 `auto` 모드(auto_push:true=개인)만 수집 → company-internal(false)은 자동수집 제외
#         (회사데이터를 개인 GitHub 아카이브로 자동 끌어오지 않게). deploy-only 배포물(예: bns-intranet)은 애초에 미등록.
# allow_internal:
#   엔진이 채팅에서 사내 마커(사내 도메인·네임스페이스·사설 IP)를 감지하면, personal 이라도
#   평문 raw 를 자동으로 커밋에서 격리(.gitignore)한다 — 회사정보의 개인 클라우드 유출 방지(안전 기본값).
#   true = 사용자가 검토하고 평문 유지를 명시 허용(격리 해제). 미설정/false = 격리.

agora:
  repo: E:\agora
  sessions:            # 15 jsonl 총계
    - E--agora         # 6
    - E--agora-claude  # 4
    - E--agora-gemini  # 5
  # E--agora-agora / E--agora-claude-agora 는 jsonl 0개(memory만) → 제외
  sensitivity: company-internal
  auto_push: false     # 회사 데이터 — 자동 푸시 금지, 수동 검토 후에만

llm-wiki:
  repo: E:\llm-wiki
  sessions:
    - E--llm-wiki      # 3
  sensitivity: personal
  auto_push: true      # 개인 데이터 — 주기적 자동 새로고침/푸시 허용
  # ⚠️ 이 채팅엔 사내 마커(사내 도메인/호스트·내부IP)가 많고 이미 GitHub 히스토리에 평문으로 올라가 있음.
  # 사용자가 검토하고 '그대로 둠'(평문 유지)을 선택 → allow_internal 로 자동격리 해제. (신규 프로젝트는 기본 격리됨)
  allow_internal: true

intra:
  repo: E:\intra
  sessions:
    - e--intra         # 1 (대부분의 intra 작업은 E--second-brain cwd 에서 진행됨 — 거기 섞여 있음)
  sensitivity: company-internal   # 실배포 사내 인트라넷(<사내도메인>)
  auto_push: false                # 회사 데이터 — 자동 푸시 금지, 수동 검토 후에만

second-brain:
  repo: E:\second-brain
  sessions:
    - E--second-brain
  # 이 repo 대화엔 agora 내부 주소(사내 도메인 등) 언급이 섞여 있어 company-internal 로 분류 → 평문 raw 는 gitignore
  sensitivity: company-internal
  auto_push: false

chaebo:
  repo: E:\chaebo
  sessions: E--chaebo
  sensitivity: personal   # 개인 음악 연습 도구(비상업) — 사내 데이터 무관
  auto_push: true
