# DEPLOY.manifest.yaml — 파이프라인 최종 산출물 (경계 C). 배포 결과 + REQ별 smoke.

project: <slug>
profile: <local|intranet>

target:
  # local:    { kind: docker-compose, where: "로컬/단일 호스트" }
  # intranet: { kind: k8s, where: "<사내도메인> / <사내ns> ns", registry: "<harbor레지스트리>" }
  kind: <docker-compose|k8s>
  where: <...>

secrets: [DATABASE_URL, SESSION_SECRET]   # 외부화된 env 이름만 (값 아님)

endpoints:
  - name: web
    url: <http://localhost:3000 | https://<app>.<사내도메인>>

health:
  path: /api/health
  expect: '200 {status:"ok", db:"ok"}'   # DB-aware: status 키만이 아니라 핵심 의존(DB) 상태 포함 — DB 끊기면 비정상 반환(false-done D)

shutdown:
  sigterm: true            # graceful shutdown 구현됨 (DB 풀 close)

rollback: "<이전 태그로 재기동 / kubectl set image ...>"
rollback_tested: <true|N/A+이유>   # 명시 ≠ 실행 — 실제로 1회 행사했나(false-done D). false/공란이면 critic blocker
manifest_changed: <true|false>     # env/볼륨/configmap/secret 변경 있으면 set image 아닌 kubectl apply -f 강제(false-done D)

smoke:                     # REQ별 — acceptance 를 given/when/then 1:1, 의역·약화 없이 검사
  - req: REQ-CORE-001
    check: "<curl ... 또는 시나리오>"
    env: <production|staging|dry-run>   # ★로컬 기동(크레덴셜 없음)은 반드시 dry-run — 라이브 클러스터(TLS·인증·CORS·시크릿) 미경유
    result: <pass|fail|dry-run>         # env:dry-run 이면 result 도 dry-run(≠pass) — 게이트가 라이브 완료로 오인 금지
  - req: REQ-OPS-001
    check: "curl .../api/health -> 200 {status:ok, db:ok}"
    env: production
    result: pass

concurrency_probe:         # 선점성/쓰기 REQ별 — 동시 N요청·멱등 2회 POST 결과(없으면 ops_gaps). 무상태 REQ는 생략
  # - { req: REQ-CORE-001, kind: concurrent|idempotent, observed: "동시 2요청 → 성공 row 1" }

ops_gaps: []               # 백업·모니터링·만료/로테이션(time-decay)·비기능(성능/용량) 미비점(critic이 채움). 비면 OK.
